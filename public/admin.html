<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOKER Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e6; --panel:#ffffff; --line:rgba(190,150,60,.18);
    --gold:#d4af37; --gold-2:#f0d478; --gold-dark:#9c7a1e;
    --ink:#2b2210; --ink-dim:rgba(43,34,16,.6);
    --ok:#3f8f76; --err:#d1495b;
    --shadow-puff: 0 10px 24px rgba(190,150,60,.18), 0 2px 6px rgba(190,150,60,.12), inset 0 1px 0 rgba(255,255,255,.6);
    --shadow-btn: 0 8px 18px rgba(212,175,55,.35), inset 0 1px 0 rgba(255,255,255,.5), inset 0 -3px 6px rgba(150,110,10,.25);
  }
  *{box-sizing:border-box;}
  body{
    background:
      radial-gradient(900px 500px at 90% -10%, rgba(240,212,120,.35), transparent 60%),
      radial-gradient(700px 400px at 0% 100%, rgba(212,175,55,.12), transparent 60%),
      var(--bg);
    color:var(--ink);font-family:'Noto Sans Myanmar',sans-serif;margin:0;padding:24px;min-height:100vh;
  }
  .wrap{max-width:1000px;margin:0 auto;}
  h1{font-size:20px;color:var(--gold-dark);text-shadow:0 1px 0 #fff;}
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:20px;
    box-shadow:var(--shadow-puff);
  }
  input,select{
    background:#fffdf8;border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:12px;
    font-family:'JetBrains Mono',monospace;font-size:13px;box-shadow:inset 0 2px 4px rgba(150,110,10,.08);
  }
  button{
    background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#3a2a05;border:none;
    padding:10px 18px;border-radius:14px;cursor:pointer;font-family:'Noto Sans Myanmar';font-weight:700;font-size:13px;
    box-shadow:var(--shadow-btn); transition:transform .12s, box-shadow .12s;
  }
  button:hover{transform:translateY(-1px);}
  button:active{transform:translateY(1px);box-shadow:0 3px 8px rgba(212,175,55,.3), inset 0 2px 4px rgba(150,110,10,.3);}
  button.danger{background:linear-gradient(180deg,#ef7c8a,var(--err));color:#fff;box-shadow:0 8px 18px rgba(209,73,91,.35), inset 0 1px 0 rgba(255,255,255,.4);}
  button.ghost{background:#fffdf8;color:var(--gold-dark);border:1px solid var(--line);box-shadow:none;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);}
  th{color:var(--ink-dim);font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
  td.code{font-family:'JetBrains Mono',monospace;color:var(--gold-dark);font-weight:600;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .tag{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600;}
  .tag.active{background:rgba(63,143,118,.15);color:var(--ok);}
  .tag.inactive{background:rgba(209,73,91,.15);color:var(--err);}
  .tag.vip{background:rgba(212,175,55,.22);color:var(--gold-dark);}
  .tag.free{background:rgba(43,34,16,.08);color:var(--ink-dim);}
  .tag.pending{background:rgba(240,180,60,.2);color:#a06a10;}
  #loginBox{max-width:340px;margin:70px auto;text-align:center;}
  .tabs{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .tab-btn{background:#fffdf8;border:1px solid var(--line);color:var(--ink-dim);padding:10px 18px;border-radius:14px;cursor:pointer;font-family:'Noto Sans Myanmar';font-size:13px;box-shadow:0 2px 6px rgba(190,150,60,.08);}
  .tab-btn.active{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#3a2a05;font-weight:700;box-shadow:var(--shadow-btn);}
  .avatar{width:26px;height:26px;border-radius:50%;vertical-align:middle;margin-right:6px;box-shadow:0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.15);}
  .pay-card{display:flex;gap:14px;padding:14px;border-radius:16px;background:#fffdf8;box-shadow:0 4px 14px rgba(190,150,60,.12);margin-bottom:12px;}
  .pay-card img{width:100px;height:100px;object-fit:cover;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.15);}
  .pay-info{flex:1;font-size:13px;line-height:1.7;}
  .pay-actions{display:flex;flex-direction:column;gap:8px;justify-content:center;}
  .empty{color:var(--ink-dim);text-align:center;padding:30px;font-size:13px;}
</style>
</head>
<body>
<div class="wrap">

  <div id="loginBox" class="panel">
    <h1>🂡 JOKER Admin</h1>
    <p style="color:var(--ink-dim);font-size:13px;">Admin Password</p>
    <div class="row" style="justify-content:center;">
      <input type="password" id="passwordInput" placeholder="Password">
      <button id="loginBtn">ဝင်မယ်</button>
    </div>
    <p id="loginError" style="color:var(--err);font-size:12px;"></p>
  </div>

  <div id="dashboard" style="display:none;">
    <h1>🂡 JOKER Admin Dashboard</h1>

    <div class="tabs">
      <button class="tab-btn active" data-tab="payments">💳 Pending Payments</button>
      <button class="tab-btn" data-tab="licenses">🎟 License Codes</button>
      <button class="tab-btn" data-tab="users">👤 Users (Free / VIP)</button>
    </div>

    <div id="tab-payments">
      <div class="panel">
        <p style="color:var(--ink-dim);font-size:13px;margin:0 0 12px;">Plan ဝယ်ပြီး screenshot တင်ထားသူများ — Telegram ထဲကလည်း Approve/Reject လုပ်လို့ရပါတယ်</p>
        <div id="paymentsList"></div>
      </div>
    </div>

    <div id="tab-licenses" style="display:none;">
    <div class="panel">
      <div class="row">
        <select id="planSelect">
          <option value="7A">7A — 100,000 char / 7 ရက် — 10,000 ကျပ်</option>
          <option value="7B">7B — 250,000 char / 7 ရက် — 20,000 ကျပ်</option>
          <option value="30A">30A — 300,000 char / 30 ရက် — 30,000 ကျပ်</option>
          <option value="30B">30B — 1,000,000 char / 30 ရက် — 50,000 ကျပ်</option>
          <option value="30C">30C — 2,000,000 char / 30 ရက် — 80,000 ကျပ်</option>
        </select>
        <input type="text" id="noteInput" placeholder="Note (ဥပမာ — Customer name/Telegram)">
        <button id="createBtn">+ Code အသစ်ထုတ်မယ်</button>
      </div>
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr><th>Code</th><th>Plan</th><th>Used / Limit</th><th>Expires</th><th>Owner Email</th><th>Note</th><th>Status</th><th colspan="2"></th></tr>
        </thead>
        <tbody id="licenseTable"></tbody>
      </table>
    </div>
    </div>

    <div id="tab-users" style="display:none;">
      <div class="panel">
        <p style="color:var(--ink-dim);font-size:13px;margin:0 0 12px;">Google login ဝင်ထားတဲ့ user အားလုံး</p>
        <table>
          <thead>
            <tr><th>User</th><th>Joined</th><th>Last login</th><th>Status</th><th>Plan/Trial</th><th>Remaining</th><th>Code</th></tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
let ADMIN_PASSWORD = '';

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-payments').style.display = btn.dataset.tab === 'payments' ? 'block' : 'none';
    document.getElementById('tab-licenses').style.display = btn.dataset.tab === 'licenses' ? 'block' : 'none';
    document.getElementById('tab-users').style.display = btn.dataset.tab === 'users' ? 'block' : 'none';
    if (btn.dataset.tab === 'users') loadUsers();
    if (btn.dataset.tab === 'payments') loadPayments();
    if (btn.dataset.tab === 'licenses') loadLicenses();
  });
});

document.getElementById('loginBtn').addEventListener('click', async () => {
  const pw = document.getElementById('passwordInput').value;
  const res = await fetch('/api/admin/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }),
  });
  if (res.ok) {
    ADMIN_PASSWORD = pw;
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadPayments();
  } else {
    document.getElementById('loginError').textContent = 'Password မှားနေပါတယ်';
  }
});

async function adminFetch(url, options = {}) {
  return fetch(url, {
    ...options,
    headers: { ...(options.headers || {}), 'X-Admin-Password': ADMIN_PASSWORD, 'Content-Type': 'application/json' },
  });
}

// ---------- Payments tab ----------
async function loadPayments() {
  const el = document.getElementById('paymentsList');
  el.innerHTML = '<div class="empty">Loading...</div>';
  const res = await adminFetch('/api/admin/payments?status=pending');
  const payments = await res.json();
  if (!res.ok) { el.innerHTML = `<div class="empty">${payments.error}</div>`; return; }
  if (!payments.length) { el.innerHTML = '<div class="empty">Pending payment မရှိပါ</div>'; return; }
  el.innerHTML = payments.map(p => `
    <div class="pay-card">
      ${p.screenshot_b64 ? `<img src="data:image/jpeg;base64,${p.screenshot_b64}">` : ''}
      <div class="pay-info">
        <div><b>${p.plan_code}</b> · ${p.amount.toLocaleString()} ကျပ်</div>
        <div>Email: ${p.email || '-'}</div>
        <div>Telegram: ${p.telegram_username ? '@' + p.telegram_username : '-'}</div>
        <div style="color:var(--ink-dim);font-size:12px;">${new Date(p.created_at).toLocaleString()}</div>
      </div>
      <div class="pay-actions">
        <button onclick="decidePayment(${p.id},'approve')">✅ Approve</button>
        <button class="danger" onclick="decidePayment(${p.id},'reject')">❌ Reject</button>
      </div>
    </div>
  `).join('');
}

async function decidePayment(id, action) {
  const res = await adminFetch(`/api/admin/payments/${id}/${action}`, { method: 'POST' });
  const data = await res.json();
  if (!res.ok) { alert('Error: ' + data.error); return; }
  if (action === 'approve') alert('Approve ပြီးပါပြီ — Code: ' + data.code);
  loadPayments();
}

// ---------- Licenses tab ----------
async function loadLicenses() {
  const res = await adminFetch('/api/admin/licenses');
  const licenses = await res.json();
  const tbody = document.getElementById('licenseTable');
  tbody.innerHTML = licenses.map(l => `
    <tr>
      <td class="code">${l.code}</td>
      <td>${l.plan}</td>
      <td>${l.chars_used.toLocaleString()} / ${l.char_limit.toLocaleString()}</td>
      <td>${new Date(l.expires_at).toLocaleDateString('my-MM')}</td>
      <td>${l.email || '<span style="color:var(--ink-dim)">— မသုံးရသေးပါ —</span>'}</td>
      <td>${l.note || ''}</td>
      <td><span class="tag ${l.active ? 'active' : 'inactive'}">${l.active ? 'Active' : 'Off'}</span></td>
      <td><button class="ghost" onclick="topUp('${l.code}')">➕ Top-up</button></td>
      <td><button class="danger" onclick="toggleLicense('${l.code}')">${l.active ? 'Deactivate' : 'Activate'}</button></td>
    </tr>
  `).join('');
}

async function topUp(code) {
  const extraChars = prompt('ထပ်ထည့်မယ့် စာလုံးရေ (ဥပမာ 100000):', '100000');
  if (extraChars === null) return;
  const extraDays = prompt('ထပ်တိုးမယ့် ရက် (မလိုရင် 0):', '0');
  if (extraDays === null) return;
  const res = await adminFetch(`/api/admin/licenses/${code}/extend`, {
    method: 'POST', body: JSON.stringify({ extraChars: Number(extraChars) || 0, extraDays: Number(extraDays) || 0 }),
  });
  const data = await res.json();
  if (!res.ok) { alert('Error: ' + data.error); return; }
  loadLicenses();
}

async function loadUsers() {
  const tbody = document.getElementById('usersTable');
  tbody.innerHTML = '<tr><td colspan="7">Loading...</td></tr>';
  const res = await adminFetch('/api/admin/users');
  const data = await res.json();
  if (!res.ok) { tbody.innerHTML = `<tr><td colspan="7" style="color:var(--err);">${data.error}</td></tr>`; return; }

  tbody.innerHTML = data.map(u => `
    <tr>
      <td>${u.avatar_url ? `<img class="avatar" src="${u.avatar_url}">` : ''}${u.email}</td>
      <td>${new Date(u.created_at).toLocaleDateString('my-MM')}</td>
      <td>${u.last_sign_in_at ? new Date(u.last_sign_in_at).toLocaleDateString('my-MM') : '—'}</td>
      <td><span class="tag ${u.status === 'VIP' ? 'vip' : 'free'}">${u.status === 'VIP' ? '⭐ VIP' : 'Free'}</span></td>
      <td>${u.status === 'VIP' ? u.plan : `Daily trial (${u.free_used_today}/500 today)`}</td>
      <td>${u.remaining.toLocaleString()} စာလုံး</td>
      <td class="code">${u.code || '—'}</td>
    </tr>
  `).join('');
}

document.getElementById('createBtn').addEventListener('click', async () => {
  const plan = document.getElementById('planSelect').value;
  const note = document.getElementById('noteInput').value;
  const res = await adminFetch('/api/admin/licenses', { method: 'POST', body: JSON.stringify({ plan, note }) });
  const data = await res.json();
  if (res.ok) {
    alert('Code ထုတ်ပြီးပါပြီ:\n' + data.code);
    document.getElementById('noteInput').value = '';
    loadLicenses();
  } else {
    alert('Error: ' + data.error);
  }
});

async function toggleLicense(code) {
  await adminFetch(`/api/admin/licenses/${code}/toggle`, { method: 'POST' });
  loadLicenses();
}
</script>
</body>
</html>
